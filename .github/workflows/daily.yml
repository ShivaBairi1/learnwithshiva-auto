
name: LearnWithShiva scheduled videos

on:
  workflow_dispatch:
  schedule:
    # Tuesday, Thursday and Saturday at 6 PM India time
    - cron: "30 12 * * 2,4,6"

permissions:
  contents: read

concurrency:
  group: learnwithshiva-publishing
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Create and upload educational videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py

      - name: Save failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-logs
          path: output/
          if-no-files-found: ignore
          retention-days: 3
